# Un pod de dev que pide 4 cores: excede el presupuesto
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-job
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batch-job
  template:
    metadata:
      labels:
        app: batch-job
    spec:
      containers:
        - name: app
          image: registry.access.redhat.com/ubi9/httpd-24
          resources:
            requests:
              cpu: "4"
              memory: 2Gi
