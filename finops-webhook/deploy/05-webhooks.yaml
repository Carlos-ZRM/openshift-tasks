apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: finops-mutating
  annotations:
    # OpenShift inyecta el caBundle del service-ca
    service.beta.openshift.io/inject-cabundle: "true"
webhooks:
  - name: mutate.finops.demo
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 5
    failurePolicy: Ignore          # si el webhook cae, no bloquea (solo deja de "ayudar")
    reinvocationPolicy: Never
    clientConfig:
      service:
        name: finops-webhook
        namespace: finops-webhook
        path: /mutate
    namespaceSelector:              # solo namespaces que opten por la política
      matchLabels:
        finops.demo/enforce: "true"
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        resources: ["deployments"]
        operations: ["CREATE", "UPDATE"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: finops-validating
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
webhooks:
  - name: validate.finops.demo
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 5
    failurePolicy: Fail            # si el webhook cae, NADA entra en los namespaces enforced
    clientConfig:
      service:
        name: finops-webhook
        namespace: finops-webhook
        path: /validate
    namespaceSelector:
      matchLabels:
        finops.demo/enforce: "true"
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        resources: ["deployments"]
        operations: ["CREATE", "UPDATE"]
