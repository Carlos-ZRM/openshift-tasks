apiVersion: v1
kind: ServiceAccount
metadata:
  name: finops-webhook
  namespace: finops-webhook
---
# El mutating necesita leer las labels del Namespace para heredarlas
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: finops-webhook-read-namespaces
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: finops-webhook-read-namespaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: finops-webhook-read-namespaces
subjects:
  - kind: ServiceAccount
    name: finops-webhook
    namespace: finops-webhook
